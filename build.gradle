plugins {
    id 'java-library'
    id 'io.qameta.allure' version '4.3.0'
}

repositories {
    mavenCentral()
}

def selenideVersion = "7.19.0",
    allureVersion = "2.32.0",
    junitVersion = "5.14.2",
    slf4jVersion = "2.0.17",
    datafakerVersion = "2.7.0"
dependencies {
    testImplementation(
            "com.codeborne:selenide:$selenideVersion",
            "org.junit.jupiter:junit-jupiter:$junitVersion",
            "net.datafaker:datafaker:$datafakerVersion",
            "org.slf4j:slf4j-simple:$slf4jVersion"
    )
    testImplementation "io.qameta.allure:allure-selenide:$allureVersion"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

allure {
    report {
        version.set(allureVersion)
    }
    adapter { // отвечает за появление папочки build/allure-results
        aspectjWeaver.set(true) //обработка аннотации @Step
        frameworks {
            junit5 { //название фреймворка
                adapterVersion.set(allureVersion) //версия интеграции фреймворка и Allure
            }
        }
    }
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    systemProperties(System.getProperties())

    testLogging {
        lifecycle {
            events "started", "skipped", "failed", "standard_error", "standard_out"
            exceptionFormat "full"
        }
    }
}